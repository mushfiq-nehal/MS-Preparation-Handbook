site_name: MSc CSE Prep
site_description: A modern, exam-focused handbook for MSc CSE admission preparation
site_author: Nehal
repo_url: https://github.com/mushfiq-nehal/MS-Preparation-Handbook
repo_name: mushfiq-nehal/MS-Preparation-Handbook
edit_uri: edit/main/docs/
docs_dir: docs

# ─────────────────────────────────────────────────────────────────
# Theme
# ─────────────────────────────────────────────────────────────────
theme:
  name: material
  language: en
  icon:
    logo: material/atom-variant
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    view: material/eye-outline
    admonition:
      note: material/lightbulb-outline
      tip: material/star-four-points-outline
      warning: material/alert-circle-outline
      example: material/test-tube
      quote: material/format-quote-close
  favicon: assets/favicon.svg

  font:
    text: Inter
    code: JetBrains Mono

  palette:
    # Default: dark first (modern docs sites lean dark)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  features:
    # Navigation
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Header
    - header.autohide
    # Content
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view
    - announce.dismiss

# ─────────────────────────────────────────────────────────────────
# Markdown Extensions
# ─────────────────────────────────────────────────────────────────
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# ─────────────────────────────────────────────────────────────────
# Plugins
# ─────────────────────────────────────────────────────────────────
plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

# ─────────────────────────────────────────────────────────────────
# Extra (CSS / JS)
# ─────────────────────────────────────────────────────────────────
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
  status:
    new: Recently added
    deprecated: Deprecated
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mushfiq-nehal/MS-Preparation-Handbook
      name: GitHub repository

# ─────────────────────────────────────────────────────────────────
# Navigation
# ─────────────────────────────────────────────────────────────────
nav:
  - Home: index.md
  - Core (Tier S/A):
    - "DSA": "01 - Data Structures & Algorithms.md"
    - "Operating Systems": "02 - Operating Systems.md"
    - "Computer Networks": "03 - Computer Networks & Data Communication.md"
    - "Compiler & Automata": "04 - Compiler Design & Automata.md"
    - "Digital Logic": "05 - Digital Logic Design.md"
    - "Software Engineering": "06 - Software Engineering.md"
    - "Database Systems": "07 - Database Management System.md"
    - "AI & Machine Learning": "08 - Artificial Intelligence & Machine Learning.md"
    - "OOP": "09 - Object Oriented Programming.md"
    - "Programming Fundamentals": "10 - Programming Fundamentals.md"
  - Foundations (Tier B):
    - "Discrete Math": "11 - Discrete Mathematics.md"
    - "Computer Architecture": "12 - Computer Architecture.md"
    - "Numerical Analysis": "13 - Numerical Analysis.md"
  - Electives (Tier C):
    - "Subjects 14–20": "14-20 - Tier C Subjects.md"
